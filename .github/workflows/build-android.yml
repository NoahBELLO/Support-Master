name: Build Android APK

on:
  push:
    tags:
      - 'v*'        # Exercice 3 — déclenchement uniquement sur les tags (v1.0.0, v1.2.3…)
  workflow_dispatch: # Toujours possible de lancer manuellement depuis GitHub

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configuration Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configuration Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Installation des dépendances npm
        working-directory: frontend
        run: npm ci

      - name: Build Next.js (export statique)
        working-directory: frontend
        run: npm run build
        env:
          BUILD_MODE: export

      - name: Initialisation Capacitor Android
        working-directory: frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch build.gradle — Versionning automatique
        # Exercice 2 : android/ est généré à la volée par Capacitor, on patche
        # build.gradle immédiatement après pour injecter versionCode/versionName
        working-directory: frontend/android/app
        run: |
          VERSION_CODE=${{ github.run_number }}
          # Extraire la version depuis le tag (ex: v1.2.3 → 1.2.3), sinon fallback
          VERSION_NAME="${{ github.ref_name }}"
          VERSION_NAME="${VERSION_NAME#v}"                      # supprime le préfixe 'v'
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0.${VERSION_CODE}"
          # Remplacer versionCode et versionName dans build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" build.gradle
          echo "✓ APK version : ${VERSION_NAME} (code ${VERSION_CODE})"
          grep -E "versionCode|versionName" build.gradle

      - name: Permissions Gradle
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Compilation APK avec version
        # Exercice 2 : passe versionCode/versionName en propriétés Gradle
        working-directory: frontend/android
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="${{ github.ref_name }}"
          VERSION_NAME="${VERSION_NAME#v}"
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0.${VERSION_CODE}"
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g" \
            -PversionCode=${VERSION_CODE} \
            -PversionName=${VERSION_NAME}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.ref_name }}-${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Résumé du build
        run: |
          APK_PATH="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          VERSION_NAME="${{ github.ref_name }}"
          VERSION_NAME="${VERSION_NAME#v}"
          [ -z "$VERSION_NAME" ] && VERSION_NAME="1.0.${{ github.run_number }}"
          echo "## ✅ Build Android réussi" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Information | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Fichier | app-debug.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| Taille | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${VERSION_NAME} (build #${{ github.run_number }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY

      - name: Notification d'échec
        if: failure()
        run: |
          echo "## ❌ Build Android échoué" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Causes fréquentes :**" >> $GITHUB_STEP_SUMMARY
          echo "- next.config.ts sans gestion de \`BUILD_MODE=export\`" >> $GITHUB_STEP_SUMMARY
          echo "- capacitor.config.json absent ou mal configuré" >> $GITHUB_STEP_SUMMARY
          echo "- Erreur de compilation dans le code Next.js" >> $GITHUB_STEP_SUMMARY
